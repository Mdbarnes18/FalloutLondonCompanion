app-id: org.falloutlondon.Companion
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: fallout-london-companion
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
modules:
  - name: fallout-london-companion
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/fallout-london-companion
      - cp -a app/. /app/opt/fallout-london-companion/
      - install -Dm755 launcher /app/bin/fallout-london-companion
      - install -Dm644 org.falloutlondon.Companion.desktop /app/share/applications/org.falloutlondon.Companion.desktop
      - install -Dm644 app.png /app/share/icons/hicolor/512x512/apps/org.falloutlondon.Companion.png
    sources:
      - type: dir
        path: ../build/compose/binaries/main-release/app/Fallout London Companion
        dest: app
      - type: script
        dest-filename: launcher
        commands:
          - exec /app/opt/fallout-london-companion/bin/Fallout\\ London\\ Companion
      - type: file
        path: ../src/main/resources/org.falloutlondon.Companion.desktop
      - type: file
        path: ../src/main/resources/app-flatpak.png
        dest-filename: app.png
