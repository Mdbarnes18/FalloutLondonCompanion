name: Build ATTA-Boy IPA

permissions:
  contents: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: atta-boy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          xcodebuild build \
            -project FalloutLondonCompanion.xcodeproj \
            -scheme ATTA-Boy \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ATTA-Boy.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry ATTA-Boy.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATTA-Boy-ipa
          path: ${{ runner.temp }}/ATTA-Boy.ipa
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          releases="$(gh api --paginate repos/${{ github.repository }}/releases --jq '.[].tag_name' || true)"

          next="1.0"
          max=-1

          while IFS= read -r tag; do
            case "$tag" in
              1.*)
                suffix="${tag#1.}"
                if [[ "$suffix" =~ ^[0-9]+$ ]]; then
                  value=$((10#$suffix))
                  if (( value > max )); then
                    max=$value
                  fi
                fi
                ;;
            esac
          done <<< "$releases"

          if (( max >= 0 )); then
            next=$(printf '1.%02d' "$((max + 1))")
          fi

          tag="$next"
          title="FalloutLondonCompanion $next"

          gh release create "$tag" \
            "$RUNNER_TEMP/ATTA-Boy.ipa" \
            --title "$title" \
            --generate-notes \
            --target ${{ github.sha }}
