name: Build ATTA-Boy IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project FalloutLondonCompanion.xcodeproj \
            -scheme ATTA-Boy \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ATTA-Boy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/ATTA-Boy.xcarchive/Products/Applications/ATTA-Boy.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry ATTA-Boy.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATTA-Boy-ipa
          path: \${{ runner.temp }}/ATTA-Boy.ipa
          if-no-files-found: error
