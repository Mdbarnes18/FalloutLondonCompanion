name: Build Fallout London Companion Android

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Name APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Fallout London Companion.apk"

      - name: Validate APK
        run: |
          test -f "app/build/outputs/apk/debug/Fallout London Companion.apk"
          file "app/build/outputs/apk/debug/Fallout London Companion.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: Fallout-London-Companion-android-apk
          path: Android/app/build/outputs/apk/debug/Fallout London Companion.apk
          if-no-files-found: error
